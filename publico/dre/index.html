<title>DRE Gerencial A Academia</title>
<style>
:root{--bg:#1c1c1c;--card:#ffffff;--ink:#141414;--ink2:#5b5b5b;--line:#d9d9d9;--acc:#1a1a1a;--err:#b42318}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);min-height:100%;margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-inline:16px}
.box{background:var(--card);border-radius:12px;padding:28px 26px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.box h1{font-size:20px;margin:0}
.box p{margin:0;color:var(--ink2);font-size:13.5px}
label{font-size:13px;font-weight:600}
input{font:inherit;font-size:18px;letter-spacing:.2em;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;width:100%;color:var(--ink);background:#fff}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;font-weight:600;padding:11px;border:0;border-radius:8px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--err);font-size:13px;min-height:1.2em}
</style>
