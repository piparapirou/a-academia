<script>
(function(){
  const B=JSON.parse(document.getElementById('gate-blob').textContent);
  const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  async function abrir(pw){
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(B.s),iterations:B.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(B.i)},key,u8(B.c));
    const html=new TextDecoder().decode(pt);
    window.__AACAD={pw:pw,src:html};
    const doc=new DOMParser().parseFromString(html,'text/html');
    document.title=doc.title||document.title;
    doc.head.querySelectorAll('style,link').forEach(n=>document.head.appendChild(document.importNode(n,true)));
    document.querySelectorAll('style[data-gate]').forEach(n=>n.remove());
    document.body.innerHTML=doc.body.innerHTML;
    for(const old of Array.from(document.body.querySelectorAll('script'))){
      if(old.type&&old.type!=='text/javascript'&&old.type!=='module')continue;
      const s=document.createElement('script');
      for(const a of old.attributes)s.setAttribute(a.name,a.value);
      s.textContent=old.textContent;old.replaceWith(s);
    }
  }
  const f=document.getElementById('gate-f'),pwi=document.getElementById('gate-pw'),btn=document.getElementById('gate-go'),err=document.getElementById('gate-err');
  f.addEventListener('submit',async e=>{
    e.preventDefault();btn.disabled=true;btn.textContent='Abrindo…';err.textContent='';
    try{await abrir(pwi.value)}catch(x){err.textContent='Senha incorreta. Confira e tente de novo.';btn.disabled=false;btn.textContent='Entrar';pwi.select()}
  });
  let once=null;try{once=sessionStorage.getItem('aacad-main-pw');sessionStorage.removeItem('aacad-main-pw')}catch(e){}
  if(once){btn.disabled=true;btn.textContent='Abrindo…';abrir(once).catch(()=>{btn.disabled=false;btn.textContent='Entrar'})}else{pwi.focus()}
})();
</script>
