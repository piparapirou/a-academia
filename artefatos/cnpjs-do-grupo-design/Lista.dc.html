<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>CNPJs em lista compacta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&amp;family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 880px; min-height: 560px; box-sizing: border-box; padding: 36px 40px; display: flex; flex-direction: column; gap: 20px; background: {{t.bg}}; color: {{t.ink}}; font-family: 'IBM Plex Sans', system-ui, sans-serif">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Archivo', sans-serif; font-stretch: 112%; font-weight: 750; font-size: 26px">CNPJs do grupo</h1>
<div style="font-size: 13px; color: {{t.ink2}}">Clique em um CNPJ para copiar</div>
</div>
<button type="button" onClick="{{copyAll}}" style="min-height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: {{t.acc}}; color: {{t.onAcc}}; font: 600 14px 'IBM Plex Sans', sans-serif; cursor: pointer">{{allLabel}}</button>
</div>
<div style="background: {{t.surface}}; border: 1px solid {{t.line}}; border-radius: 14px; overflow: hidden">
<div style="display: grid; grid-template-columns: 170px 1fr 240px; gap: 16px; padding: 12px 20px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: {{t.ink2}}; background: {{t.s2}}">
<div>Unidade</div><div>Empresa</div><div>CNPJ</div>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
<div style="display: grid; grid-template-columns: 170px 1fr 240px; gap: 16px; align-items: center; padding: 6px 20px; border-top: 1px solid {{t.line}}; min-height: 52px">
<div><span style="display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{t.accSoft}}; color: {{t.accInk}}">{{r.unit}}</span></div>
<div style="font-size: 15px; font-weight: 500">{{r.name}}</div>
<button type="button" onClick="{{r.copy}}" aria-label="{{r.aria}}" style="justify-self: start; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 10px; margin-left: -10px; border: 0; border-radius: 8px; background: {{r.bg}}; color: {{t.ink}}; font: 600 16px 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; cursor: pointer">
<span>{{r.cnpj}}</span>
<span style="font: 600 11px 'IBM Plex Sans', sans-serif; color: {{t.acc}}">{{r.hint}}</span>
</button>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tema":{"editor":"enum","options":["claro","escuro"],"default":"claro"},"$preview":{"width":880,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const L = {bg:'#f4f6f5',surface:'#ffffff',s2:'#eef2f0',ink:'#111614',ink2:'#4a5550',line:'#dce2df',acc:'#0e6b5c',accSoft:'#dcefea',accInk:'#0b5649',onAcc:'#ffffff'};
    const D = {bg:'#0e1211',surface:'#161b19',s2:'#1d2421',ink:'#edf2ef',ink2:'#b1bbb6',line:'#29312e',acc:'#43b59f',accSoft:'#17312b',accInk:'#8fdcc9',onAcc:'#0e1211'};
    const t = (this.props.tema ?? 'claro') === 'escuro' ? D : L;
    const data = [
      ['Nova Campinas','RR2 Atividades','17.397.249/0001-85'],
      ['Nova Campinas','3R Apoio','26.167.479/0001-49'],
      ['Cambuí','RCR3 Academia','21.075.194/0001-64'],
      ['Taquaral','ARR Atividades','05.851.277/0001-41'],
      ['Taquaral','ARR Apoio','08.107.884/0001-90'],
      ['Sousas','RC Sousas','39.145.795/0001-61'],
      ['Paulínia','Academia Templo','02.339.706/0001-08']
    ];
    const copied = this.state && this.state.copied;
    const put = (txt, key) => {
      try { navigator.clipboard && navigator.clipboard.writeText(txt).catch(() => {}); } catch (e) {}
      this.setState({ copied: key });
      clearTimeout(this._tm);
      this._tm = setTimeout(() => this.setState({ copied: null }), 1500);
    };
    const rows = data.map(([unit, name, cnpj]) => ({
      unit, name, cnpj, aria: 'Copiar CNPJ de ' + name,
      hint: copied === cnpj ? 'copiado' : '',
      bg: copied === cnpj ? t.accSoft : 'transparent',
      copy: () => put(cnpj, cnpj)
    }));
    const all = data.map(([u, n, c]) => n + ' (' + u + '): ' + c).join('\n');
    return {
      t, rows,
      allLabel: copied === '__all' ? 'Lista copiada' : 'Copiar todos',
      copyAll: () => put(all, '__all')
    };
  }
}
</script>
</body>
</html>
